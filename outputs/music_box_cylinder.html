<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mechanical Music Box</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

const MELODY = [{"angle":10,"noteIdx":7},{"angle":25,"noteIdx":8},{"angle":40,"noteIdx":9},{"angle":55,"noteIdx":7},{"angle":70,"noteIdx":9},{"angle":85,"noteIdx":11},{"angle":100,"noteIdx":0},{"angle":115,"noteIdx":12},{"angle":130,"noteIdx":11},{"angle":145,"noteIdx":9},{"angle":160,"noteIdx":4},{"angle":175,"noteIdx":7},{"angle":190,"noteIdx":8},{"angle":205,"noteIdx":9},{"angle":220,"noteIdx":11},{"angle":235,"noteIdx":14},{"angle":250,"noteIdx":0},{"angle":265,"noteIdx":13},{"angle":280,"noteIdx":12},{"angle":295,"noteIdx":11},{"angle":310,"noteIdx":9},{"angle":325,"noteIdx":8},{"angle":340,"noteIdx":7},{"angle":355,"noteIdx":4}];
const P = {"origin":[320,254.82093883020653],"scale":1.3178691733581152,"azimuth":48,"elevation":32};
const CYL_X0 = -58;
const CYL_X1 = 58;
const CYL_Y = -8;
const CYL_Z = 36;
const CYL_R = 25;

// Web Audio API Procedural Acoustic Comb Synthesis
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playToothNote(noteIdx) {
  try {
    initAudio();
    const note = NOTES[noteIdx];
    if (!note || !audioCtx) return;
    const now = audioCtx.currentTime;

    // Harmonic bell-like comb resonance
    const osc = audioCtx.createOscillator();
    const oscHarmonic = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(note.freq, now);

    // Comb stiffness produces high metallic inharmonic overtone (approx 2.76x fundamental)
    oscHarmonic.type = "sine";
    oscHarmonic.frequency.setValueAtTime(note.freq * 2.756, now);

    // Sharp percussive pluck attack and slow resonant exponential decay
    const decay = 0.4 + note.weight * 0.9; // bass teeth ring longer
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);

    osc.connect(gain);
    oscHarmonic.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    oscHarmonic.start(now);
    osc.stop(now + decay);
    oscHarmonic.stop(now + decay);
  } catch(e) {}
}

// Robust Anatomy Iso-projection formula
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function projectPoint(x, y, z) {
  const a = P.azimuth * RADIANS;
  const e = P.elevation * RADIANS;
  const sinA = Math.sin(a), cosA = Math.cos(a), sinE = Math.sin(e), cosE = Math.cos(e);
  const k = P.scale * UNIT;
  return [P.origin[0] + (x * sinA - y * cosA) * k, P.origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

const stage = document.querySelector(".iso-stage");
const readout = document.querySelector("[data-readout]");
const pinsGroup = document.getElementById("mb-pins");
const cylShading = document.getElementById("cyl-shades");
const govVanes = document.getElementById("gov-vanes");

// Pre-create persistent DOM elements for pins to avoid innerHTML overhead & flickering
const PIN_ELEMENTS = MELODY.map((m, i) => {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("stroke-width", "1.6");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke", "var(--anatomy-hi)");
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot.setAttribute("r", "1.8");
  dot.setAttribute("fill", "var(--anatomy-lit)");
  dot.setAttribute("opacity", "0");
  pinsGroup.appendChild(line);
  pinsGroup.appendChild(dot);
  return { line, dot, m, idx: i };
});

// Pre-create 24 cylinder surface flutes
const SLICES = 24;
const CYL_SLICES = [];
for (let i = 0; i < SLICES; i++) {
  const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  poly.setAttribute("stroke-width", "0.4");
  cylShading.appendChild(poly);
  CYL_SLICES.push(poly);
}

let currentAngle = 0;
let targetAngle = 0;
let autoPlay = true;
let isDragging = false;
let startX = 0;
let lastTime = 0;
let toothPlucks = new Array(NOTES.length).fill(0);
let lastPluckedIndex = -1;

// The comb teeth tips meet the cylinder at theta = -28.4° (or 331.6°)
const CONTACT_ANGLE = 331.6;

function updateScene(deg) {
  const normDeg = ((deg % 360) + 360) % 360;
  const radOffset = (normDeg * Math.PI) / 180;

  // 1. Update Cylinder Shaded Flutes
  for (let i = 0; i < SLICES; i++) {
    const a0 = radOffset + (i / SLICES) * Math.PI * 2;
    const a1 = radOffset + ((i + 1) / SLICES) * Math.PI * 2;
    const y0 = CYL_Y + Math.cos(a0) * CYL_R;
    const z0 = CYL_Z + Math.sin(a0) * CYL_R;
    const y1 = CYL_Y + Math.cos(a1) * CYL_R;
    const z1 = CYL_Z + Math.sin(a1) * CYL_R;

    const midA = (a0 + a1) / 2;
    const ny = Math.cos(midA), nz = Math.sin(midA);
    const dot = nz * 0.7 - ny * 0.7;
    let shade = "0";
    if (dot > 0.55) shade = "top";
    else if (dot > 0.2) shade = "3";
    else if (dot > -0.2) shade = "2";
    else if (dot > -0.55) shade = "1";

    const fill = shade === "top" ? "var(--anatomy-top)" : ("var(--anatomy-shade-" + shade + ")");
    const poly = CYL_SLICES[i];

    if (y0 + y1 > CYL_Y * 2 - 12) {
      const p00 = projectPoint(CYL_X0, y0, z0);
      const p01 = projectPoint(CYL_X1, y0, z0);
      const p11 = projectPoint(CYL_X1, y1, z1);
      const p10 = projectPoint(CYL_X0, y1, z1);
      poly.setAttribute("points", `${p00.join(',')} ${p01.join(',')} ${p11.join(',')} ${p10.join(',')}`);
      poly.setAttribute("fill", fill);
      poly.setAttribute("stroke", fill);
      poly.setAttribute("display", "");
    } else {
      poly.setAttribute("display", "none");
    }
  }

  // 2. Update Pins & Collision Detection
  let activeNote = null;
  PIN_ELEMENTS.forEach(({ line, dot, m, idx }) => {
    // Current world angle of this pin
    const worldAngle = (m.angle + normDeg) % 360;
    const pinRad = (worldAngle * Math.PI) / 180;
    const note = NOTES[m.noteIdx];

    const cosR = Math.cos(pinRad);
    const sinR = Math.sin(pinRad);

    const bx = note.x;
    const by = CYL_Y + cosR * CYL_R;
    const bz = CYL_Z + sinR * CYL_R;

    const px = note.x;
    const py = CYL_Y + cosR * (CYL_R + 2.5);
    const pz = CYL_Z + sinR * (CYL_R + 2.5);

    // Collision check around the comb contact zone (CONTACT_ANGLE approx 331.6°)
    const angleDiff = ((worldAngle - CONTACT_ANGLE + 180) % 360) - 180;
    const inContact = Math.abs(angleDiff) < 6;

    if (inContact) {
      const flex = Math.max(0, 1 - Math.abs(angleDiff) / 6);
      toothPlucks[m.noteIdx] = Math.max(toothPlucks[m.noteIdx], flex);

      // Trigger audio on snap release
      if (angleDiff > 0 && angleDiff < 3.5 && lastPluckedIndex !== idx) {
        lastPluckedIndex = idx;
        playToothNote(m.noteIdx);
        activeNote = note;
      }
    }

    // Render pin if on forward facing hemisphere
    if (sinR > -0.65) {
      const ptBase = projectPoint(bx, by, bz);
      const ptTip = projectPoint(px, py, pz);
      line.setAttribute("x1", ptBase[0].toFixed(1));
      line.setAttribute("y1", ptBase[1].toFixed(1));
      line.setAttribute("x2", ptTip[0].toFixed(1));
      line.setAttribute("y2", ptTip[1].toFixed(1));
      line.setAttribute("stroke", inContact ? "var(--anatomy-lit)" : "var(--anatomy-hi)");
      line.setAttribute("display", "");

      if (inContact) {
        dot.setAttribute("cx", ptTip[0].toFixed(1));
        dot.setAttribute("cy", ptTip[1].toFixed(1));
        dot.setAttribute("opacity", "1");
      } else {
        dot.setAttribute("opacity", "0");
      }
    } else {
      line.setAttribute("display", "none");
      dot.setAttribute("opacity", "0");
    }
  });

  // 3. Update Comb Teeth Deflection & Vibration Glow
  NOTES.forEach((note, i) => {
    const toothEl = document.getElementById("tooth-" + i);
    const glowEl = document.getElementById("glow-" + i);
    const val = toothPlucks[i];
    if (toothEl && glowEl) {
      if (val > 0.01) {
        toothEl.style.transform = `translateY(${(-val * 2.8).toFixed(2)}px)`;
        glowEl.setAttribute("opacity", (val * 0.95).toFixed(2));
      } else {
        toothEl.style.transform = "none";
        glowEl.setAttribute("opacity", "0");
      }
    }
    toothPlucks[i] *= 0.86;
    if (toothPlucks[i] < 0.005) toothPlucks[i] = 0;
  });

  // 4. Update Governor Butterfly Vane
  if (govVanes) {
    const govDeg = normDeg * 5;
    const vanX0 = Math.cos((govDeg * Math.PI) / 180) * 8;
    const vanY0 = Math.sin((govDeg * Math.PI) / 180) * 8;
    const p1 = projectPoint(96 - vanX0, CYL_Y - vanY0, CYL_Z + 25);
    const p2 = projectPoint(96 + vanX0, CYL_Y + vanY0, CYL_Z + 25);
    govVanes.setAttribute("d", `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`);
  }

  // 5. Update Status Readout
  if (readout) {
    if (activeNote) {
      readout.textContent = activeNote.note + " · " + activeNote.freq.toFixed(1) + " Hz · plucking comb";
    } else if (autoPlay) {
      readout.textContent = "playing · " + normDeg.toFixed(0) + "° · 18 tuned lamellae";
    }
  }
}

// Main Frame Loop
function animate(now) {
  if (!lastTime) lastTime = now;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (autoPlay && !isDragging) {
    targetAngle += 45 * dt; // constant tempo governed by air governor
  }

  // Smooth rotational spring follow
  currentAngle += (targetAngle - currentAngle) * (1 - Math.exp(-dt * 14));
  updateScene(currentAngle);

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Pointer interaction (works on both mouse drag and touch swipe)
function onPointerDown(e) {
  initAudio();
  isDragging = true;
  autoPlay = false;
  startX = e.clientX;
  if (stage.setPointerCapture) {
    try { stage.setPointerCapture(e.pointerId); } catch(err) {}
  }
}

function onPointerMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  startX = e.clientX;
  targetAngle += dx * 0.85;
}

function onPointerUp(e) {
  if (!isDragging) return;
  isDragging = false;
  setTimeout(() => { autoPlay = true; }, 3500);
}

stage.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove);
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);

// Keyboard controls
let idleTimer = null;
function handleKey(e) {
  initAudio();
  if (e.key === "ArrowRight" || e.key === "ArrowUp") {
    e.preventDefault();
    autoPlay = false;
    targetAngle += 12;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { autoPlay = true; }, 4000);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
    e.preventDefault();
    autoPlay = false;
    targetAngle -= 12;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { autoPlay = true; }, 4000);
  } else if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    autoPlay = !autoPlay;
    clearTimeout(idleTimer);
    if (readout) {
      readout.textContent = autoPlay ? "resumed · space to pause" : "paused · press space or arrows";
    }
  }
}
window.addEventListener("keydown", handleKey);
