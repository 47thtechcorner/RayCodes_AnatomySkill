<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manual Burr Coffee Grinder</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const P = {"origin":[320,330.85613615939315],"scale":1.3005466528856506,"azimuth":46,"elevation":28};
const CYL_X = 0;
const CYL_Y = 0;
const BODY_R = 28;
const BURR_Z0 = 46;
const BURR_Z1 = 74;
const BEANS_DATA = [{"x":-8,"y":-4,"z0":125,"zSpeed":38,"rot":0.3,"size":3.8},{"x":10,"y":6,"z0":110,"zSpeed":36,"rot":1.1,"size":4.1},{"x":-12,"y":8,"z0":96,"zSpeed":42,"rot":2.2,"size":3.7},{"x":6,"y":-10,"z0":84,"zSpeed":40,"rot":0.8,"size":4.2},{"x":-4,"y":12,"z0":76,"zSpeed":44,"rot":1.9,"size":3.9},{"x":8,"y":-2,"z0":68,"zSpeed":45,"rot":2.7,"size":3.6}];

// ISO project helper
function projectPoint(x, y, z) {
  const radAz = (P.azimuth * Math.PI) / 180;
  const radEl = (P.elevation * Math.PI) / 180;
  const ca = Math.cos(radAz), sa = Math.sin(radAz);
  const ce = Math.cos(radEl), se = Math.sin(radEl);
  const px = x * ca - y * sa;
  const py = x * sa + y * ca;
  const screenX = P.origin[0] + px * P.scale;
  const screenY = P.origin[1] + (-py * se - z * ce) * P.scale;
  return [screenX, screenY];
}

const stage = document.querySelector(".iso-stage");
const readout = document.querySelector("[data-readout]");
const dynamicGroup = document.getElementById("grinder-dynamic");
const groundParticlesGroup = document.getElementById("ground-particles");

let crankAngle = 0;
let targetCrank = 0;
let isDragging = false;
let lastPointerAngle = 0;
let lastTime = 0;
let autoTurn = true;
let totalBeansCrushed = 142;
let grindMicrons = 480; // Medium-Fine Pour Over
let clickCount = 18;

// Particle system for ground coffee falling into catch cup
let grounds = [];
for (let i = 0; i < 35; i++) {
  grounds.push({
    x: (Math.random() - 0.5) * 28,
    y: (Math.random() - 0.5) * 28,
    z: 15 + Math.random() * 25,
    size: 0.8 + Math.random() * 0.9,
    vx: (Math.random() - 0.5) * 4,
    vy: (Math.random() - 0.5) * 4,
    vz: -20 - Math.random() * 30
  });
}

// Procedural audio context for realistic burr crunching and bearing clicks
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playCrunchSound(intensity) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    // Noise buffer for bean fracture crush
    const bufferSize = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    // Filter to emphasize dry, crisp roasted bean crunch
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(1200 + Math.random() * 400, now);
    filter.Q.setValueAtTime(2.2, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.01 + intensity * 0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  } catch(e) {}
}

let lastCrunchAngle = 0;

function drawDynamicComponents(deg) {
  const rad = (deg * Math.PI) / 180;
  let svgs = [];

  // 1. Central Drive Axle
  const ax0 = projectPoint(CYL_X, CYL_Y, 35);
  const ax1 = projectPoint(CYL_X, CYL_Y, 170);
  svgs.push(`<line x1="${ax0[0].toFixed(1)}" y1="${ax0[1].toFixed(1)}" x2="${ax1[0].toFixed(1)}" y2="${ax1[1].toFixed(1)}" stroke="var(--anatomy-hi)" stroke-width="3" stroke-linecap="round"/>`);

  // 2. Rotating Conical Inner Burr (48 HRC Hardened Steel)
  // Height from BURR_Z0 (46) to BURR_Z1 (74)
  // Top cone radius: 10, Bottom cone radius: 23
  const flutes = 10;
  for (let f = 0; f < flutes; f++) {
    const fluteAngle = rad + (f * Math.PI * 2) / flutes;
    const fluteAngle1 = rad + ((f + 0.5) * Math.PI * 2) / flutes;

    // Spiral twist along cone height
    const topX0 = CYL_X + Math.cos(fluteAngle + 0.5) * 11;
    const topY0 = CYL_Y + Math.sin(fluteAngle + 0.5) * 11;
    const topX1 = CYL_X + Math.cos(fluteAngle1 + 0.5) * 11;
    const topY1 = CYL_Y + Math.sin(fluteAngle1 + 0.5) * 11;

    const botX0 = CYL_X + Math.cos(fluteAngle) * 23;
    const botY0 = CYL_Y + Math.sin(fluteAngle) * 23;
    const botX1 = CYL_X + Math.cos(fluteAngle1) * 23;
    const botY1 = CYL_Y + Math.sin(fluteAngle1) * 23;

    // Front-facing projection test
    if (Math.sin(fluteAngle) > -0.6) {
      const pT0 = projectPoint(topX0, topY0, BURR_Z1);
      const pT1 = projectPoint(topX1, topY1, BURR_Z1);
      const pB1 = projectPoint(botX1, botY1, BURR_Z0);
      const pB0 = projectPoint(botX0, botY0, BURR_Z0);

      // Light shade on cutting flutes
      const lightFacing = Math.cos(fluteAngle + 0.3);
      const shade = lightFacing > 0.4 ? "var(--anatomy-top)" : (lightFacing > -0.2 ? "var(--anatomy-shade-2)" : "var(--anatomy-shade-0)");

      svgs.push(`<polygon points="${pT0.join(',')} ${pT1.join(',')} ${pB1.join(',')} ${pB0.join(',')}" fill="${shade}" stroke="var(--anatomy-hi)" stroke-width="0.5"/>`);
      // Micro-cutting razor edge line
      svgs.push(`<line x1="${pT0[0].toFixed(1)}" y1="${pT0[1].toFixed(1)}" x2="${pB0[0].toFixed(1)}" y2="${pB0[1].toFixed(1)}" stroke="var(--anatomy-lit)" stroke-width="1"/>`);
    }
  }

  // 3. Falling Roasted Coffee Beans in Hopper
  BEANS_DATA.forEach((bean, bIdx) => {
    // Beans cycle down as crank turns
    const fallDist = ((deg * 0.12 + bean.z0) % 95);
    const currZ = 145 - fallDist;

    // Beans converge towards center as they enter conical burr throat
    const radiusAtZ = currZ > BURR_Z1 ? 16 : (11 + (currZ - BURR_Z0) * 0.4);
    const bRad = (deg * 0.05 + bean.rot * Math.PI);
    const bx = CYL_X + Math.cos(bRad) * (radiusAtZ * 0.65);
    const by = CYL_Y + Math.sin(bRad) * (radiusAtZ * 0.65);

    if (currZ > BURR_Z0 + 2) {
      const pBean = projectPoint(bx, by, currZ);
      // Dark roast bean ellipse with central cleft crease
      svgs.push(`
        <g class="mb-bean" transform="translate(${pBean[0].toFixed(1)},${pBean[1].toFixed(1)}) rotate(${(deg + bIdx * 45) % 360})">
          <ellipse cx="0" cy="0" rx="${bean.size}" ry="${bean.size * 0.65}" fill="#3d2314" stroke="#663a20" stroke-width="0.6"/>
          <path d="M ${-bean.size * 0.7} 0 Q 0 -0.8 ${bean.size * 0.7} 0" stroke="#1d1109" stroke-width="0.8" fill="none"/>
        </g>
      `);
    }
  });

  // 4. Top Crank Arm & Ergonomic Wood Knob
  const CRANK_LEN = 62;
  const crankTipX = CYL_X + Math.cos(rad) * CRANK_LEN;
  const crankTipY = CYL_Y + Math.sin(rad) * CRANK_LEN;
  const pCenter = projectPoint(CYL_X, CYL_Y, 168);
  const pTip = projectPoint(crankTipX, crankTipY, 168);

  // Arm thickness extrusion
  const pCenterUnder = projectPoint(CYL_X, CYL_Y, 164);
  const pTipUnder = projectPoint(crankTipX, crankTipY, 164);

  svgs.push(`<polygon points="${pCenter.join(',')} ${pTip.join(',')} ${pTipUnder.join(',')} ${pCenterUnder.join(',')}" fill="var(--anatomy-shade-1)" stroke="var(--anatomy-hi)" stroke-width="0.8"/>`);
  svgs.push(`<line x1="${pCenter[0].toFixed(1)}" y1="${pCenter[1].toFixed(1)}" x2="${pTip[0].toFixed(1)}" y2="${pTip[1].toFixed(1)}" stroke="var(--anatomy-lit)" stroke-width="1.8"/>`);

  // Central locking knurled thumb nut
  svgs.push(`<circle cx="${pCenter[0].toFixed(1)}" cy="${pCenter[1].toFixed(1)}" r="5.5" fill="var(--anatomy-top)" stroke="var(--anatomy-hi)" stroke-width="0.8"/>`);
  svgs.push(`<circle cx="${pCenter[0].toFixed(1)}" cy="${pCenter[1].toFixed(1)}" r="2.5" fill="var(--anatomy-shade-0)"/>`);

  // Wooden spherical handle knob on crank tip
  const pKnobTop = projectPoint(crankTipX, crankTipY, 184);
  const pKnobBot = projectPoint(crankTipX, crankTipY, 168);
  svgs.push(`<line x1="${pKnobBot[0].toFixed(1)}" y1="${pKnobBot[1].toFixed(1)}" x2="${pKnobTop[0].toFixed(1)}" y2="${pKnobTop[1].toFixed(1)}" stroke="var(--anatomy-hi)" stroke-width="2.5"/>`);
  svgs.push(`<circle cx="${pKnobTop[0].toFixed(1)}" cy="${pKnobTop[1].toFixed(1)}" r="9" fill="#8c5835" stroke="#4a2a16" stroke-width="1"/>`);
  svgs.push(`<circle cx="${pKnobTop[0] - 2.5}" cy="${pKnobTop[1] - 2.5}" r="2.2" fill="#c48a60" opacity="0.6"/>`);

  dynamicGroup.innerHTML = svgs.join("");

  // 5. Update ground coffee particles falling from burr exit
  let particleSvgs = [];
  grounds.forEach((g) => {
    g.z += g.vz * 0.02;
    if (g.z < 2) {
      g.z = BURR_Z0 - 1;
      g.x = (Math.random() - 0.5) * 24;
      g.y = (Math.random() - 0.5) * 24;
    }
    const pt = projectPoint(g.x, g.y, g.z);
    particleSvgs.push(`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${g.size}" fill="#4a2c1b"/>`);
  });
  groundParticlesGroup.innerHTML = particleSvgs.join("");

  // Sound trigger on bean shear
  if (Math.abs(deg - lastCrunchAngle) > 28) {
    playCrunchSound(Math.min(1, Math.abs(deg - lastCrunchAngle) / 40));
    lastCrunchAngle = deg;
    totalBeansCrushed += 2;
  }

  // Update live technical readout
  const normalizedDeg = ((deg % 360) + 360) % 360;
  readout.textContent = normalizedDeg.toFixed(0) + "° crank · " + grindMicrons + " µm burr gap · click " + clickCount + "/30";
}

function tick(now) {
  if (!lastTime) lastTime = now;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (autoTurn && !isDragging) {
    targetCrank += 55 * dt; // steady grinding speed (approx 55 RPM equivalent)
  }

  crankAngle += (targetCrank - crankAngle) * (1 - Math.exp(-dt * 10));
  drawDynamicComponents(crankAngle);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// User Drag Interaction
stage.addEventListener("pointerdown", (e) => {
  initAudio();
  isDragging = true;
  autoTurn = false;
  const rect = stage.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  lastPointerAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const rect = stage.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const currAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
  let dTheta = currAngle - lastPointerAngle;
  if (dTheta > Math.PI) dTheta -= Math.PI * 2;
  if (dTheta < -Math.PI) dTheta += Math.PI * 2;
  lastPointerAngle = currAngle;
  targetCrank += (dTheta * 180) / Math.PI;
});

const stopDrag = (e) => {
  if (!isDragging) return;
  isDragging = false;
  setTimeout(() => { autoTurn = true; }, 3500);
};
stage.addEventListener("pointerup", stopDrag);
stage.addEventListener("pointercancel", stopDrag);

// Keyboard controls on window and stage so keys respond immediately
function handleGrinderKeyDown(e) {
  initAudio();
  autoTurn = false;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") {
    e.preventDefault();
    targetCrank += 18;
  } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
    e.preventDefault();
    targetCrank -= 18;
  } else if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    autoTurn = !autoTurn;
  } else if (e.key === "+" || e.key === "=") {
    e.preventDefault();
    clickCount = Math.min(30, clickCount + 1);
    grindMicrons = 200 + clickCount * 20;
  } else if (e.key === "-" || e.key === "_") {
    e.preventDefault();
    clickCount = Math.max(5, clickCount - 1);
    grindMicrons = 200 + clickCount * 20;
  }
  setTimeout(() => { autoTurn = true; }, 4000);
}
window.addEventListener("keydown", handleGrinderKeyDown);
stage.addEventListener("keydown", handleGrinderKeyDown);
</script></body></html>
